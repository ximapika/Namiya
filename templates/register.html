{% extends "base.html" %}
{% block title %}注册{% endblock %}
{% block content %}

<div class="form-container">
    <div class="form-header">
        <div class="form-icon">📝</div>
        <h1 class="form-title">创建账号</h1>
        <p class="form-subtitle">加入解忧杂货铺，开始倾诉之旅</p>
    </div>
    <form method="POST" autocomplete="on" data-password-purpose="register" data-email-purpose="register">
        {% include "_csrf.html" %}
        <div class="form-group">
            <label class="form-label" for="username">用户名</label>
            <input class="form-input" type="text" id="username" name="username"
                   placeholder="2–20 个字符" minlength="2" maxlength="20"
                   autocomplete="username" required>
        </div>
        {% include "_email_verification.html" %}
        <div class="form-group">
            <label class="form-label" for="password">密码</label>
            <input class="form-input" type="password" id="password" data-password-field
                   placeholder="至少 {{ config.PASSWORD_MIN_LENGTH }} 个字符" minlength="{{ config.PASSWORD_MIN_LENGTH }}" maxlength="128"
                   autocomplete="new-password" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="confirm">确认密码</label>
            <input class="form-input" type="password" id="confirm" data-password-confirm
                   placeholder="再次输入密码" minlength="{{ config.PASSWORD_MIN_LENGTH }}" maxlength="128"
                   autocomplete="new-password" required>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">注册</button>
        </div>
    </form>
    <div class="form-footer">
        已有账号？<a href="{{ url_for('auth.login') }}">直接登录</a>
    </div>
</div>

<noscript><p class="flash flash-error">请启用 JavaScript 后注册，以完成验证码和密码加密。</p></noscript>

{% endblock %}
{% block extra_js %}{% include "_password_scripts.html" %}{% endblock %}
